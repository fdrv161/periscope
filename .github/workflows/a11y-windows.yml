# Builds Periscope (VST3, Windows x64) for testing with NVDA.
# Runs on every push to the accessible branch and manually (Actions -> Run workflow).
# Output: the Periscope-windows-vst3 artifact (the Periscope.vst3 folder inside a ZIP).
name: A11y Windows build

on:
  push:
    branches: [accessible]
  workflow_dispatch: {}

concurrency:
  group: a11y-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: TELESCOPE VST3 (Windows x64)
    # windows-2022, not latest: the Visual Studio 17 2022 generator is needed (same as the main ci.yml).
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The repository name is in the key: cached deps store absolute paths, which change when the repo is renamed.
      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-windows-juce8016-${{ github.event.repository.name }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            deps-windows-juce8016-${{ github.event.repository.name }}-

      # Tests and libmysofa are off, as in the main ci.yml: TELESCOPE does not need them to build the plugin.
      - name: Configure
        run: >
          cmake -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DOVNI_BUILD_TESTS=OFF
          -DOVNI_WITH_SOFA=OFF
          .

      - name: Build TELESCOPE VST3
        run: cmake --build build --config Release --target telescope_VST3

      - name: Find bundle
        run: |
          set -euo pipefail
          bundle=$(find build -type d -path '*telescope_artefacts/Release/VST3/*.vst3' | head -1)
          [ -n "$bundle" ] || { echo "VST3 bundle not found"; exit 1; }
          echo "VST3_BUNDLE=$bundle" >> "$GITHUB_ENV"
          # The folder that holds the .vst3 bundle: upload it so the ZIP contains the whole plugin folder.
          echo "VST3_DIR=$(dirname "$bundle")" >> "$GITHUB_ENV"
          echo "bundle: $bundle"

      # Upload the artifact before pluginval: even if the validator finds something, the build can still be tested by hand.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Periscope-windows-vst3
          path: ${{ env.VST3_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Pluginval (strictness 10)
        run: |
          set -euo pipefail
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip"
          unzip -oq pluginval.zip
          ./pluginval.exe --strictness-level 10 --validate "$VST3_BUNDLE"
